<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego | Sito - Mauro</title>
    <script src="./main.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div id="container">
        <div id="container_botones">
            <button id="btn_1" class="btn_luz">1</button>
            <button id="btn_2" class="btn_luz">2</button>
            <button id="btn_3" class="btn_luz">3</button>
            <button id="btn_4" class="btn_luz">4</button>
            <button id="btn_5" class="btn_luz">5</button>
            <button id="btn_6" class="btn_luz">6</button>
            <button id="btn_7" class="btn_luz">7</button>
        </div>
        <img src="arco_2.png" id="arco">

        <div id="control">
            <button id="btn_play" class="btn_control">Iniciar</button>
            <button id="btn_reload" class="btn_control">Recargar</button>
        </div>
        <div id="panel_estado">
            <p>Intentos restantes: <span id="span_intentos_restantes"></span></p>
            <p>Delay promedio: <span id="span_delay_promedio"></span></p>
        </div>
    </div>
    
</body>
</html>
